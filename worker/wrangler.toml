# Private deployment configuration for this fork.
# Run from worker/: npm ci && npx wrangler deploy
# Configure either a restricted GitHub App or a fine-grained token:
#   npx wrangler secret put GITHUB_TOKEN
# Never store GitHub credentials in this file or in the repository.
# The deployed *.workers.dev URL (not the GitHub repo URL) is what
# belongs in Starling > Mods > Build server > Use this server.
name = "starling-compile-jssantogit"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

[vars]
REPO = "jssantogit/mod-builds"
